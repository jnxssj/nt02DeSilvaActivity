<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Sign In </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../static/css/signin.css">
    </head>

    <body>

    <main class="page">
        <div class="card">

            <div class="community-frame">
                <img
                    src="../static/images/Slide.jpg"
                    alt="Community photo"
                    class="community-img"
                >
            </div>

            <div class="form-side">
                <p class="eyebrow">Sign In</p>
                <h1>Welcome</h1>
                <p class="subtitle">To keep connected with us, please login with your personal info.</p>

                <form id="signinForm" novalidate>
                    
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@gmail.com" required>
                        <small class="error" id="emailError"></small>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <small class="error" id="passwordError"></small>
                        <div class="forgot-row"><a href="#">Forgot Password?</a></div>
                        
                    </div>

                    <button type="submit" class="btn-primary">Sign In</button>

                    <p class="switch-text">Don't have an account? <a href="../templates/signup.html">Sign up</a></p>

                </form>
            </div>

        </div>
    </main>

    <script src="../static/scripts/signin.js"></script>
    </body>
</html>
